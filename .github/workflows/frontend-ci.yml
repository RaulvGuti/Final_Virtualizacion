name: Frontend KubeLab CI
on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths: ['apps/web/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/frontend-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node (solo para comprobar sintaxis JS, no se despliega Node)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint / syntax (sin npm ni package.json)
        run: |
          node --check js/config.js
          node --check js/app.js
          python -m compileall -q mock tests
      - name: Validar manifiestos YAML
        run: |
          python -m pip install pyyaml
          python tests/check_manifests.py
      - name: Unit/integration tests del servidor demo (stdlib)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Preparar navegador para pruebas de interfaz
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Pruebas CRUD de interfaz en Chromium
        run: python tests/browser_smoke.py
      - name: Build estático
        run: |
          test -s index.html
          test -s css/styles.css
          test -s js/app.js
      - name: Validar configuración Nginx con contenedor de producción
        run: |
          docker build -t kubelab-web:ci .
          docker run --rm -d --name kubelab-web-ci -p 127.0.0.1:18080:80 --add-host kubelab-api:127.0.0.1 kubelab-web:ci
          trap 'docker rm -f kubelab-web-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:18080/healthz; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ | grep -q KubeLab
          curl -fsS http://127.0.0.1:18080/js/app.js | grep -q apiRequest

  publish:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/kubelab-web" >> "$GITHUB_OUTPUT"
      - name: Build and push (etiqueta inmutable SHA; tag de versión opcional)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('{0}:{1}', steps.image.outputs.name, github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
