apiVersion: v1
kind: ConfigMap
metadata:
  name: kubelab-web-config
  labels:
    app.kubernetes.io/name: kubelab-web
data:
  # Service interno Express documentado en apps/api/API-CONTRACT.md.
  API_UPSTREAM: 'api-service:3000'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelab-web
  labels:
    app.kubernetes.io/name: kubelab-web
    app.kubernetes.io/part-of: kubelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubelab-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubelab-web
        app.kubernetes.io/part-of: kubelab
    spec:
      containers:
        - name: nginx
          image: docker.io/library/kubelab-web:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kubelab-web-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
---
apiVersion: v1
kind: Service
metadata:
  name: kubelab-web
  labels:
    app.kubernetes.io/name: kubelab-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubelab-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
